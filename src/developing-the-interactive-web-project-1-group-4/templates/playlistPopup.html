<!-- Playlist popup: opened from a playlist card on the Library page -->
<dialog id="playlistDialog" class="pl-dialog" aria-labelledby="plTitle">

    <div class="pl-head">
        <div>
            <p class="pl-eyebrow">PLAYLIST</p>
            <h2 id="plTitle" class="pl-title"></h2>
            <p id="plMeta" class="pl-meta"></p>
        </div>
        <button type="button" class="pl-close" id="plClose" aria-label="Close">✕</button>
    </div>

    <div class="pl-now" id="plNow" hidden>
        <video id="plVideo" class="pl-video" playsinline preload="none"></video>
        <div class="pl-now-info">
            <p class="pl-eyebrow pl-now-label" id="plNowLabel">NOW PLAYING</p>
            <p class="pl-now-title" id="plNowTitle"></p>
            <p class="pl-now-artist" id="plNowArtist"></p>
            <div class="pl-progress-row">
                <div class="pl-progress"><div class="pl-progress-bar" id="plBar"></div></div>
                <span class="pl-time" id="plTime">0:00 / 0:00</span>
            </div>
        </div>
    </div>

    <ol class="pl-list" id="plList"></ol>
    <p class="pl-empty" id="plEmpty" hidden>This playlist has no videos yet.</p>
    <p class="pl-error" id="plError" role="alert" hidden></p>

    <div class="pl-controls">
        <button type="button" class="pl-btn" id="plPrev">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2L5 7l7 5z"/><path d="M2.5 2v10" stroke-linecap="round"/></svg>
            Previous
        </button>
        <button type="button" class="pl-btn pl-btn-primary" id="plPlay">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="currentColor"><path d="M3 1.5v11l9-5.5z"/></svg>
            Play
        </button>
        <button type="button" class="pl-btn" id="plPause">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="currentColor"><rect x="2.5" y="2" width="3" height="10" rx="1"/><rect x="8.5" y="2" width="3" height="10" rx="1"/></svg>
            Pause
        </button>
        <button type="button" class="pl-btn" id="plResume">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 7a5 5 0 1 1-1.8-3.8"/><path d="M11 1.5v3h-3"/></svg>
            Resume
        </button>
        <button type="button" class="pl-btn" id="plNext">
            Next
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 2l7 5-7 5z"/><path d="M11.5 2v10" stroke-linecap="round"/></svg>
        </button>
    </div>
</dialog>
