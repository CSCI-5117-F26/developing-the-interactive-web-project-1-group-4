<!-- "Create a new playlist" box inside the Add to playlist pop-up (Home + Trending) -->
<form id="quickPlaylistForm" class="quick-playlist" autocomplete="off"
      data-create-url="{{ url_for('library.create_playlist') }}"
      data-add-template="{{ url_for('library.add_to_playlist', playlist_id=0) }}">
    <label for="quickPlaylistTitle">Or create a new playlist</label>
    <div class="pure-g">
        <div class="pure-u-3-4 qp-input">
            <input type="text" id="quickPlaylistTitle" name="title" maxlength="200"
                   placeholder="Playlist name" required>
        </div>
        <div class="pure-u-1-4">
            <button type="submit" class="pure-button">Create</button>
        </div>
    </div>
</form>
