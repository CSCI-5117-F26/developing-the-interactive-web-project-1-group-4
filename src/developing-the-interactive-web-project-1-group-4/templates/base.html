<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tune In{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/main-style.css') }}">
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/feedback.css') }}">
</head>
<body>
    {% block sidebar %}
        {% include "sidebar.html" %}
    {% endblock %}

    <main class="main-page-colors">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>
</body>
</html>
